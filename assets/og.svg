<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og.png (rasterized during docker build — see Dockerfile). -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd581"/>
      <stop offset="1" stop-color="#e9a530"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.1" cy="0" r="0.7">
      <stop offset="0" stop-color="#56c7b8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#56c7b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.825" cy="0.44" r="0.42">
      <stop offset="0" stop-color="#f1b545" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#f1b545" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0a1014"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowTeal)"/>
  <rect width="1200" height="630" fill="url(#glowGold)"/>

  <!-- Brand -->
  <g transform="translate(76 62) scale(1.5)">
    <path d="M16 2 27.5 6.2V15c0 7.1-4.9 12.6-11.5 14.9C9.4 27.6 4.5 22.1 4.5 15V6.2Z" fill="url(#gold)"/>
    <path d="M16 23.5s-5.5-5.1-5.5-9.1a5.5 5.5 0 0 1 11 0c0 4-5.5 9.1-5.5 9.1Z" fill="#0a1014"/>
    <circle cx="16" cy="14.3" r="2.1" fill="#f1b545"/>
  </g>
  <text x="134" y="99" font-family="Inter, 'Liberation Sans', Arial, sans-serif" font-size="30" font-weight="600" fill="#eef3f2">GBP Shield</text>

  <!-- Eyebrow -->
  <text x="80" y="196" font-family="Inter, 'Liberation Sans', Arial, sans-serif" font-size="24" font-weight="600" fill="#8fe0d4">Dental · Med spa · HVAC</text>

  <!-- Headline -->
  <g font-family="'Instrument Serif', 'Liberation Serif', Georgia, serif" font-size="80" fill="#eef3f2">
    <text x="76" y="286">Protect your</text>
    <text x="76" y="368">Map Pack from <tspan fill="#f1b545" font-style="italic">fake</tspan></text>
    <text x="76" y="450">Google reviews.</text>
  </g>

  <!-- Value line -->
  <text x="80" y="540" font-family="Inter, 'Liberation Sans', Arial, sans-serif" font-size="24" fill="#b4c1c3">Evidence packs · Compliant review asks · Attack recovery</text>

  <!-- Emblem -->
  <circle cx="990" cy="268" r="196" fill="none" stroke="#f1b545" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="990" cy="268" r="148" fill="none" stroke="#f1b545" stroke-opacity="0.16" stroke-width="2"/>
  <g transform="translate(862 140) scale(8)">
    <path d="M16 2 27.5 6.2V15c0 7.1-4.9 12.6-11.5 14.9C9.4 27.6 4.5 22.1 4.5 15V6.2Z" fill="url(#gold)"/>
    <path d="M16 23.5s-5.5-5.1-5.5-9.1a5.5 5.5 0 0 1 11 0c0 4-5.5 9.1-5.5 9.1Z" fill="#0a1014"/>
    <circle cx="16" cy="14.3" r="2.1" fill="#f1b545"/>
  </g>

  <!-- CTA -->
  <g transform="translate(860 500)">
    <rect width="260" height="62" rx="31" fill="url(#gold)"/>
    <text x="130" y="40" text-anchor="middle" font-family="Inter, 'Liberation Sans', Arial, sans-serif" font-size="23" font-weight="700" fill="#1d1405">Join the waitlist</text>
  </g>
</svg>
